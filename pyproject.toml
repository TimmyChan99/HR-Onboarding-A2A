[project]
name = "a2a-onboarding-langflow"
version = "1.0.0"
description = "A2A 1.0 server and orchestration gateway wrapping Langflow onboarding agents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "a2a-sdk[http-server,sqlite]==1.1.2",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "chromadb>=0.5,<1",
  "google-genai>=1,<2",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "mcp[cli]>=1.27,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "rank-bm25>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.40,<1",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
